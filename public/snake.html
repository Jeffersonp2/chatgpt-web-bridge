<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>testeGPT Snake</title>
<style>
html,body{height:100%;margin:0;background:#090b10;color:#e8eef8;font-family:system-ui,sans-serif}
body{display:grid;place-items:center}
main{text-align:center}
canvas{border:1px solid #273244;border-radius:14px;background:#0e131b;box-shadow:0 15px 60px #0008}
small{display:block;margin-top:10px;color:#8fa0b8}
</style>
</head>
<body>
<main>
<h2>🐍 testeGPT Snake</h2>
<canvas id="g" width="420" height="420"></canvas>
<small>Setas / WASD • Espaço reinicia</small>
</main>
<script>
const c=document.querySelector("#g"),x=c.getContext("2d"),n=21,s=c.width/n;
let snake,dir,food,score,dead;
function rnd(){return Math.floor(Math.random()*n)}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};food={x:rnd(),y:rnd()};score=0;dead=false}
function key(e){const k=e.key.toLowerCase();if(k===" "&&dead)return reset();const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(m&&!(m[0]===-dir.x&&m[1]===-dir.y))dir={x:m[0],y:m[1]}}
addEventListener("keydown",key);
function step(){if(dead)return;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=n||h.y>=n||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;do{food={x:rnd(),y:rnd()}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop()}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle="#121925";for(let i=0;i<n;i++)for(let j=0;j<n;j++)if((i+j)%2===0)x.fillRect(i*s,j*s,s,s);x.fillStyle="#ff5577";x.beginPath();x.arc((food.x+.5)*s,(food.y+.5)*s,s*.34,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?"#6ee7a8":"#b7ffd4";x.fillRect(p.x*s+2,p.y*s+2,s-4,s-4)});x.fillStyle="#fff";x.font="bold 16px system-ui";x.fillText("Score: "+score,12,22);if(dead){x.fillStyle="#000b";x.fillRect(0,0,c.width,c.height);x.fillStyle="#fff";x.textAlign="center";x.font="bold 28px system-ui";x.fillText("Game Over",c.width/2,c.height/2);x.font="16px system-ui";x.fillText("Espaço para reiniciar",c.width/2,c.height/2+30);x.textAlign="left"}requestAnimationFrame(draw)}
reset();setInterval(step,95);draw();
</script>
</body>
</html>
